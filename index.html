<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#191a1b"><title>一针一线 · Little Stitch</title><meta name="description" content="挑几块布，剪剪、拼拼、缝几针。一个手机上的拼布小玩具。"><link rel="icon" href="favicon.svg"><link rel="stylesheet" href="style.css"></head><body><main class="room"><header><h1>little stitch</h1><button id="save" class="icon-button" aria-label="保存作品" title="保存作品"><span data-icon="save"></span></button></header><section class="workspace"><div class="utility-bar"><button id="undo" class="icon-button" aria-label="撤销" title="撤销"><span data-icon="undo"></span></button><div class="photo-toolbar"><button id="photoChoose" class="icon-button" aria-label="选择照片底图" title="选照片"><span data-icon="photo"></span></button><button id="photoCamera" class="icon-button" aria-label="拍照作为底图" title="拍一张"><span data-icon="camera"></span></button><button id="photoRemove" class="icon-button" hidden aria-label="移走照片" title="移走照片"><span data-icon="remove"></span></button><details class="extra-tools"><summary aria-label="更多工具" title="更多工具"><span data-icon="more"></span></summary><div class="extra-menu"><button id="sound" aria-label="打开声音"><span data-icon="sound"></span>声音</button><button id="clearStitches"><span data-icon="rip"></span>拆线</button><button id="reset"><span data-icon="undo"></span>重新开始</button></div></details><span id="photoStatus" class="sr-only" aria-live="polite"></span><input id="photoInput" type="file" accept="image/*" hidden><input id="cameraInput" type="file" accept="image/*" capture="environment" hidden></div></div><div class="canvas-wrap"><canvas id="canvas" width="600" height="600" aria-label="拼布工作台：选中布片拖动摆放，裁剪模式画轮廓，缝线模式划过布片缝线"></canvas></div><p id="hint" class="sr-only" aria-live="polite"></p></section><aside class="tools"><nav aria-label="制作工具"><button class="step active" data-step="fabric" aria-label="添加和摆放布料" title="布料"><span data-icon="fabric"></span></button><button class="step" data-step="cut" aria-label="裁剪布料" title="裁剪"><span data-icon="cut"></span></button><button class="step" data-step="stitch" aria-label="缝线" title="缝线"><span data-icon="stitch"></span></button></nav><section id="panel"></section><section class="layers" aria-label="布片图层顺序"><span class="layer-symbol" data-icon="layers"></span><span id="count" class="sr-only"></span><div id="layers"></div><div class="layer-arrows"><button id="raise" class="icon-button" aria-label="选中布片向上一层" title="向上一层"><span data-icon="up"></span></button><button id="lower" class="icon-button" aria-label="选中布片向下一层" title="向下一层"><span data-icon="down"></span></button></div></section><div id="selection" class="selection"></div></aside></main><div id="toast" role="status"></div><dialog id="result"><button id="close" aria-label="关闭" class="close">×</button><h2>缝好啦。</h2><img id="resultImg" alt="你的拼布作品"><a id="download" class="primary" download="我的拼布.png">保存图片</a><p class="small">手机上也可以长按图片保存</p></dialog><script src="app.js"></script></body></html>
